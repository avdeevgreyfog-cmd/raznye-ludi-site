name: Force final site refresh

on:
  push:
    paths:
      - '.github/workflows/force-final-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Force new event image URL and clean extras
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="assets/scene_11.webp"'
          new = 'src="assets/scene_11.webp?v=20260816-1932"'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('scene_11 reference not found')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f README.txt
          rm -f .github/workflows/force-final-refresh.yml

      - name: Commit final refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Force final event image refresh and clean repository"
            git push origin main
          fi
