<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171815">
  <title>Разные люди — Походы</title>
  <meta name="description" content="Рабочий модуль подготовки командных походов">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./route-v9.css">
  <link rel="stylesheet" href="./route-v10.css">
  <link rel="stylesheet" href="./route-v11.css">
  <link rel="stylesheet" href="./route-v12.css">
  <link rel="stylesheet" href="./route-v13.css">
  <link rel="stylesheet" href="./route-v14.css">
  <link rel="stylesheet" href="./route-v15.css">
  <link rel="stylesheet" href="./route-v16.css">

  <link rel="stylesheet" href="./map-studio-v21.css">
  <link rel="stylesheet" href="./map-studio-v21-fix.css">
  <link rel="stylesheet" href="./atlas-v22.css">
  <link rel="stylesheet" href="./plan-v23.css">
  <link rel="stylesheet" href="./transport-v24.css">
  <link rel="stylesheet" href="./transport-v26.css">
  <link rel="stylesheet" href="./transport-v27.css">

<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand-block">
      <div class="brand-mark">РЛ</div>
      <div>
        <div class="eyebrow">Разные люди</div>
        <div class="brand-title">Походы</div>
      </div>
    </div>

    <div class="event-switcher">
      <div class="event-switcher__label">Текущее мероприятие</div>
      <button class="event-switcher__button" id="eventSwitcher" type="button">
        <span><strong>Томинский лесопарк</strong><small>поход-тренировка</small></span>
        <span class="chev">⌄</span>
      </button>
    </div>

    <nav class="side-nav" id="nav"></nav>

    <div class="sidebar-foot">
      <button class="text-button" id="reset" type="button">Сбросить демо</button>
      <div class="build-label">V21.1 · транспорт · референс доведён</div>
    </div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div class="topbar__event">
        <span class="status-dot"></span>
        <strong>Томинский лесопарк · полевой маршрут</strong>
      </div>
      <div class="viewer">
        <span>Смотреть как</span>
        <select id="who" aria-label="Смотреть как участник"></select>
      </div>
    </header>
    <div class="page" id="app"></div>
  </main>

  <nav class="mobile-nav" id="mobile"></nav>
  <div class="mobile-sheet" id="mobileSheet" aria-hidden="true"></div>
  <div class="modal-layer" id="modalLayer" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./v8.js"></script>
  <script src="./route-v9.js"></script>
  <script src="./route-v10.js"></script>
  <script src="./route-v11.js"></script>
  <script src="./route-v12.js"></script>
  <script src="./route-v13-1.js"></script>
  <script src="./route-v13-2.js"></script>
  <script src="./route-v13-3.js"></script>
  <script src="./route-v13-4.js"></script>
  <script src="./route-v13-5.js"></script>
  <script src="./route-v13-6.js"></script>
  <script src="./route-v14-1.js"></script>
  <script src="./route-v14-2.js"></script>
  <script src="./route-v15.js"></script>
  <script src="./route-v15-fix.js"></script>
  <script src="./route-v16.js"></script>
  <script src="./route-v17.js"></script>
  <script src="./route-v18.js"></script>
  <script src="./route-v19.js"></script>
  <script src="./atlas-v20.js"></script>
  <script src="./map-studio-v21.js"></script>
  <script src="./map-studio-v21-fix.js"></script>
  <script src="./atlas-v22.js"></script>
  <script src="./plan-v23.js"></script>
  <script src="./transport-v24.js"></script>
  <script src="./transport-v24-fix.js"></script>
  <script src="./transport-v25.js"></script>
  <script src="./transport-v26.js"></script>
  <script src="./transport-v27.js"></script>
  <script src="./transport-v27-fix.js"></script>

</html>
