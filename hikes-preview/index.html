  <title>Разные люди — Походы</title>
  <meta name="description" content="Рабочий модуль подготовки командных походов">
  <script>
    (()=>{
      const current=document.documentElement.dataset.release;
      fetch(`./release.json?t=${Date.now()}`,{cache:'no-store'})
        .then(r=>r.ok?r.json():null)
        .then(data=>{
          const latest=data?.release;
          if(!latest||latest===current)return;
          const url=new URL(location.href);
          if(url.searchParams.get('release')===latest)return;
          url.searchParams.set('release',latest);
          location.replace(url.toString());
        })
        .catch(()=>{});
    })();
  </script>
